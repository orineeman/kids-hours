<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>התחברות</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <div class="card auth-card">
    <h1>כניסת הורה</h1>
    <form id="loginForm" autocomplete="off">
      <label for="password">סיסמה</label>
      <input type="password" id="password" required autocomplete="new-password" />
      <button type="submit">התחבר</button>
      <div class="error" id="err" hidden></div>
    </form>
  </div>
</div>
<script>
(async () => {
  const s = await (await fetch('/api/session')).json();
  if (s.needsSetup) location.href = '/setup.html';
  else if (s.loggedIn) location.href = '/';
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const passwordEl = document.getElementById('password');
  const password = passwordEl.value;
  passwordEl.value = '';
  const errEl = document.getElementById('err');
  errEl.hidden = true;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  if (res.ok) location.href = '/';
  else if (res.status === 429) {
    const body = await res.json().catch(() => ({}));
    const minutes = Math.ceil((body.retryAfterSeconds || 0) / 60) || 1;
    errEl.textContent = `יותר מדי ניסיונות כושלים — נסו שוב בעוד כ-${minutes} דקות.`;
    errEl.hidden = false;
  } else {
    errEl.textContent = 'סיסמה שגויה';
    errEl.hidden = false;
  }
});
</script>
</body>
</html>
