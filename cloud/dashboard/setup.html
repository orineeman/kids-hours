<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>הגדרה ראשונית</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <div class="card auth-card">
    <h1>הגדרת חשבון הורה</h1>
    <p class="muted">זו הפעם הראשונה שהמערכת רצה — צור סיסמה לניהול.</p>
    <form id="setupForm" autocomplete="off">
      <label for="password">סיסמה (לפחות 8 תווים)</label>
      <input type="password" id="password" required minlength="8" autocomplete="new-password" />
      <button type="submit">צור חשבון והמשך</button>
      <div class="error" id="err" hidden></div>
    </form>
  </div>
</div>
<script>
(async () => {
  const s = await (await fetch('/api/session')).json();
  if (!s.needsSetup) location.href = s.loggedIn ? '/' : '/login.html';
})();

document.getElementById('setupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const passwordEl = document.getElementById('password');
  const password = passwordEl.value;
  passwordEl.value = '';
  const errEl = document.getElementById('err');
  errEl.hidden = true;
  const res = await fetch('/api/setup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  if (res.ok) location.href = '/';
  else {
    errEl.textContent = 'שגיאה ביצירת החשבון';
    errEl.hidden = false;
  }
});
</script>
</body>
</html>
