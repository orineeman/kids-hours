<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>בקרת אינטרנט לילדים</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <header>
    <h1>בקרת אינטרנט לילדים</h1>
    <button class="secondary" id="logoutBtn">התנתק</button>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="time">פתיחת זמן שימוש</button>
    <button class="tab-btn" data-tab="domains">יצירת דומיינים</button>
    <button class="tab-btn" data-tab="history">היסטוריה</button>
    <button class="tab-btn" data-tab="devices">מכשירים</button>
    <button class="tab-btn" data-tab="settings">הגדרות</button>
  </nav>

  <section id="tab-time" class="tab-panel active">
    <div class="card">
      <h2>אתרים מנוהלים</h2>
      <div id="sitesTime"></div>
    </div>
  </section>

  <section id="tab-domains" class="tab-panel">
    <div class="card">
      <h2>אתרים מנוהלים</h2>
      <div id="sitesDomains"></div>
    </div>

    <div class="card">
      <h2>הוספת אתר לרשימה</h2>
      <div class="add-site">
        <input type="text" id="newName" placeholder="שם (למשל: יוטיוב)" />
        <input type="text" id="newDomains" placeholder="דומיינים מופרדים בפסיק (למשל: youtube.com,ytimg.com)" />
        <button id="addSiteBtn">הוסף</button>
      </div>
    </div>
  </section>

  <section id="tab-history" class="tab-panel">
    <div class="card">
      <h2>דוח גלישה — 7 ימים אחרונים</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>דומיין</th><th>פניות</th><th>נראה לאחרונה</th><th>נחסם</th></tr>
          </thead>
          <tbody id="reportBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="tab-devices" class="tab-panel">
    <div class="card">
      <h2>מכשירים מסונכרנים</h2>
      <p class="muted">כל מחשב שסונכרן עם הענן דרך Device Token (ראו cloud/README.md). אפשר לבטל מכשיר אבוד/חשוד — הוא יפסיק להסתנכרן מיד.</p>
      <div id="devicesList"></div>
    </div>
  </section>

  <section id="tab-settings" class="tab-panel">
    <div class="card">
      <h2>החלפת סיסמה</h2>
      <form id="passwordForm" autocomplete="off">
        <label for="currentPassword">סיסמה נוכחית</label>
        <input type="password" id="currentPassword" required autocomplete="current-password" />
        <label for="newPassword">סיסמה חדשה (לפחות 8 תווים)</label>
        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" />
        <button type="submit">עדכן סיסמה</button>
        <div class="error" id="passwordErr" hidden></div>
        <div class="ok-msg" id="passwordOk" hidden>הסיסמה עודכנה בהצלחה.</div>
      </form>
    </div>
  </section>
</div>

<script>
async function api(path, opts) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (res.status === 401) { location.href = '/login.html'; throw new Error('unauth'); }
  return res.json();
}

// Site names/domains are parent-entered, but the report's domains come
// from DNS traffic reported by the device — escape everything rendered as
// HTML rather than trusting either source.
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtRemaining(expiresAt) {
  const ms = expiresAt - Date.now();
  if (ms <= 0) return '00:00';
  const total = Math.floor(ms / 1000);
  const m = String(Math.floor(total / 60)).padStart(2, '0');
  const s = String(total % 60).padStart(2, '0');
  return `${m}:${s}`;
}

let sites = [];
let activeTab = 'time';

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-panel').forEach((panel) => {
    panel.classList.toggle('active', panel.id === `tab-${tab}`);
  });
  if (tab === 'history') loadReport();
  if (tab === 'devices') loadDevices();
}

document.querySelectorAll('.tab-btn').forEach((btn) => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function renderSitesTime() {
  const el = document.getElementById('sitesTime');

  // A poll (60s interval, visibilitychange, or a grant/revoke on another
  // row) can trigger a re-render while a parent is mid-typing into a grant
  // form's minutes input. Capture in-progress values (and focus) so the
  // rebuild below doesn't wipe them back to the value="15" default.
  const prevValues = {};
  let focusedId = null;
  el.querySelectorAll('.grant-form input').forEach((input) => {
    const row = input.closest('.site-row');
    if (!row) return;
    prevValues[row.dataset.id] = input.value;
    if (document.activeElement === input) focusedId = row.dataset.id;
  });

  el.innerHTML = sites.map((site) => `
    <div class="site-row" data-id="${site.id}">
      <span class="site-name">${escapeHtml(site.name)}<br><span class="muted">${escapeHtml(site.domains.join(', '))}</span></span>
      <span class="status ${site.blocked ? 'blocked' : 'open'}">
        ${site.blocked ? 'חסום' : 'פתוח · ' + fmtRemaining(site.expiresAt)}
      </span>
      ${site.blocked ? `
        <form class="grant-form" onsubmit="grant(event, ${site.id})">
          <input type="number" min="1" max="1440" value="15" required />
          <span class="muted">דקות</span>
          <button type="submit">פתח</button>
        </form>
      ` : `
        <button class="secondary" onclick="revoke(${site.id})">חסום עכשיו</button>
      `}
    </div>
  `).join('') || '<p class="muted">אין עדיין אתרים ברשימה.</p>';

  el.querySelectorAll('.grant-form input').forEach((input) => {
    const row = input.closest('.site-row');
    if (!row) return;
    const prev = prevValues[row.dataset.id];
    if (prev !== undefined) input.value = prev;
    if (row.dataset.id === focusedId) {
      input.focus();
      input.select();
    }
  });
}

function renderSitesDomains() {
  const el = document.getElementById('sitesDomains');
  el.innerHTML = sites.map((site) => `
    <div class="site-row" data-id="${site.id}">
      <span class="site-name">${escapeHtml(site.name)}<br><span class="muted">${escapeHtml(site.domains.join(', '))}</span></span>
      <button class="secondary" onclick="editDomains(${site.id})" title="עריכת רשימת הדומיינים">ערוך דומיינים</button>
      <button class="danger" onclick="removeSite(${site.id})" title="הסר מהרשימה">מחק</button>
    </div>
  `).join('') || '<p class="muted">אין עדיין אתרים ברשימה.</p>';
}

function renderSites() {
  renderSitesTime();
  renderSitesDomains();
}

function updateCountdowns() {
  document.querySelectorAll('#sitesTime .site-row').forEach((row) => {
    const site = sites.find((s) => s.id === Number(row.dataset.id));
    if (!site || site.blocked) return;
    const statusEl = row.querySelector('.status');
    if (statusEl) statusEl.textContent = 'פתוח · ' + fmtRemaining(site.expiresAt);
  });
}

async function loadSites() {
  sites = await api('/api/sites');
  renderSites();
}

window.grant = async (e, id) => {
  e.preventDefault();
  const minutes = Number(e.target.querySelector('input').value);
  await api(`/api/sites/${id}/grant`, { method: 'POST', body: JSON.stringify({ minutes }) });
  await loadSites();
};

window.revoke = async (id) => {
  await api(`/api/sites/${id}/revoke`, { method: 'POST' });
  await loadSites();
};

window.editDomains = async (id) => {
  const site = sites.find((s) => s.id === id);
  const input = prompt('דומיינים מופרדים בפסיק:', site.domains.join(', '));
  if (input === null) return;
  const domains = input.split(',').map((d) => d.trim()).filter(Boolean);
  if (domains.length === 0) return alert('צריך לפחות דומיין אחד');
  const result = await api(`/api/sites/${id}`, { method: 'PATCH', body: JSON.stringify({ domains }) });
  if (result?.error) return alert('דומיין לא תקין — יש להזין שם מארח בלבד, למשל github.com (לא כתובת מלאה כמו https://github.com/).');
  await loadSites();
};

window.removeSite = async (id) => {
  if (!confirm('להסיר את האתר מהרשימה?')) return;
  await api(`/api/sites/${id}`, { method: 'DELETE' });
  await loadSites();
};

document.getElementById('addSiteBtn').addEventListener('click', async () => {
  const name = document.getElementById('newName').value.trim();
  const domains = document.getElementById('newDomains').value
    .split(',').map((d) => d.trim()).filter(Boolean);
  if (!name || domains.length === 0) return alert('יש למלא שם ולפחות דומיין אחד');
  const result = await api('/api/sites', { method: 'POST', body: JSON.stringify({ name, domains }) });
  if (result?.error === 'duplicate_name') return alert('כבר קיים אתר בשם הזה.');
  if (result?.error) return alert('דומיין לא תקין — יש להזין שם מארח בלבד, למשל github.com (לא כתובת מלאה כמו https://github.com/).');
  document.getElementById('newName').value = '';
  document.getElementById('newDomains').value = '';
  await loadSites();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/login.html';
});

async function loadReport() {
  const rows = await api('/api/report?days=7');
  document.getElementById('reportBody').innerHTML = rows.map((r) => `
    <tr>
      <td>${escapeHtml(r.domain)}</td>
      <td>${r.queries}</td>
      <td>${new Date(r.last_seen).toLocaleString('he-IL')}</td>
      <td>${r.blocked_count > 0 ? 'כן' : 'לא'}</td>
    </tr>
  `).join('') || '<tr><td colspan="4" class="muted">אין נתונים עדיין</td></tr>';
}

function fmtDeviceTime(ms) {
  return ms ? new Date(ms).toLocaleString('he-IL') : 'מעולם לא';
}

async function loadDevices() {
  const devices = await api('/api/devices');
  document.getElementById('devicesList').innerHTML = devices.map((d) => `
    <div class="site-row" data-id="${escapeHtml(d.id)}">
      <span class="site-name">${escapeHtml(d.name)}<br>
        <span class="muted">
          סונכרן לאחרונה: ${fmtDeviceTime(d.last_synced_at)}${d.last_ip ? ' · ' + escapeHtml(d.last_ip) : ''}
          ${d.revoked_at ? '<br><span class="status blocked">מבוטל</span>' : ''}
        </span>
      </span>
      ${d.revoked_at ? '' : `<button class="danger" onclick="revokeDevice('${encodeURIComponent(d.id)}')" title="ביטול המכשיר">בטל מכשיר</button>`}
    </div>
  `).join('') || '<p class="muted">אין עדיין מכשיר מסונכרן.</p>';
}

window.revokeDevice = async (id) => {
  if (!confirm('לבטל את המכשיר? הוא יפסיק להסתנכרן מיד.')) return;
  await api(`/api/devices/${id}`, { method: 'DELETE' });
  await loadDevices();
};

document.getElementById('passwordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const errEl = document.getElementById('passwordErr');
  const okEl = document.getElementById('passwordOk');
  errEl.hidden = true;
  okEl.hidden = true;
  const res = await fetch('/api/password', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ currentPassword, newPassword }),
  });
  document.getElementById('passwordForm').reset();
  if (res.ok) {
    okEl.hidden = false;
  } else {
    errEl.textContent = res.status === 401 ? 'הסיסמה הנוכחית שגויה.' : 'שגיאה בעדכון הסיסמה.';
    errEl.hidden = false;
  }
});

const IDLE_TIMEOUT_MS = 5 * 60 * 1000;
let idleTimer;

function resetIdleTimer() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login.html';
  }, IDLE_TIMEOUT_MS);
}

['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach((evt) => {
  document.addEventListener(evt, resetIdleTimer, { passive: true });
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadSites();
});

(async () => {
  const s = await (await fetch('/api/session')).json();
  if (s.needsSetup) return location.href = '/setup.html';
  if (!s.loggedIn) return location.href = '/login.html';
  await loadSites();
  setInterval(updateCountdowns, 1000);   // live countdown (updates text only — full re-render would wipe in-progress form input)
  setInterval(() => { if (!document.hidden) loadSites(); }, 60000);   // pick up expiry / external changes (cosmetic only — actual blocking is enforced independently on the kid's PC)
  setInterval(() => { if (activeTab === 'history' && !document.hidden) loadReport(); }, 30000);
  resetIdleTimer();
})();
</script>
</body>
</html>
