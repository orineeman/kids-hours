name = "kids-hours-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Created once via: npx wrangler d1 create kids-hours
# — paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "kids-hours"
database_id = "REPLACE_ME_AFTER_D1_CREATE"

[assets]
directory = "./dashboard"
binding = "ASSETS"

# Once the Worker is deployed and working at its workers.dev URL, point the
# existing kids.musagim-bamaharal.org record at it (Cloudflare dashboard ->
# your domain -> Workers Routes, or uncomment this and redeploy):
# routes = [
#   { pattern = "kids.musagim-bamaharal.org/*", custom_domain = true }
# ]
