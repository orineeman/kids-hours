name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'src/**'
      - 'public/**'
      - 'install/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # better-sqlite3 v13's prebuilt binary needs NAPI_VERSION=10, which
  # Node only supports from 22.14 onward — 22.11.0 caused a runtime
  # crash even with the prebuilt (see --ignore-scripts note below).
  # Using 24.x sidesteps that version floor entirely.
  NODE_VERSION: 24.19.0

jobs:
  build:
    # No Visual Studio / node-gyp dependency here (see the --ignore-scripts
    # note below), so no need to pin a specific runner image for that.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download portable Node.js runtime (bundled into the installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath . -Force
          New-Item -ItemType Directory -Force -Path installer\runtime | Out-Null
          Copy-Item -Path "node-v$env:NODE_VERSION-win-x64\*" -Destination installer\runtime -Recurse -Force

      - name: Install npm dependencies (using the bundled Node, so native modules match)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$PWD\installer\runtime;$env:Path"
          node -v

          # better-sqlite3 v13 ships working prebuilt binaries directly in
          # its npm tarball (node_modules/better-sqlite3/prebuilds/win32-x64.node)
          # — one N-API binary that covers every Node version, no compiler
          # needed. But npm's default behavior for *any* package with a
          # binding.gyp and no explicit "install" script is to compile it
          # from source anyway via node-gyp, ignoring that prebuilt file.
          # On Node versions before 22.14 that source build is a known
          # broken combination (napi_version mismatch) and produces a
          # binary that loads fine but segfaults (0xC0000005) the moment
          # it's actually used — exactly what happened on a real install.
          # --ignore-scripts skips that unnecessary/broken rebuild so the
          # tested prebuilt binary is used instead (verified none of our
          # dependencies need an install/postinstall script to function).
          npm install --omit=dev --no-fund --no-audit --ignore-scripts

      - name: Download cloudflared (bundled into the installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile installer\runtime\cloudflared.exe

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsNetControl-Setup
          path: installer\dist\*.exe

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          name: KidsNetControl Installer (latest build)
          body: |
            מתקין Windows (.exe) שנבנה אוטומטית מהקומיט ${{ github.sha }}.
            הורידו את הקובץ למטה, הריצו אותו על מחשב הילדים בתור Administrator,
            ועקבו אחרי האשף.
          prerelease: true
          files: installer/dist/*.exe
