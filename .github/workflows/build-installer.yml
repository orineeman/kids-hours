name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'src/**'
      - 'public/**'
      - 'install/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NODE_VERSION: 22.11.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download portable Node.js runtime (bundled into the installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath . -Force
          New-Item -ItemType Directory -Force -Path installer\runtime | Out-Null
          Copy-Item -Path "node-v$env:NODE_VERSION-win-x64\*" -Destination installer\runtime -Recurse -Force

      - name: Install npm dependencies (using the bundled Node, so native modules match)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$PWD\installer\runtime;$env:Path"
          node -v

          # better-sqlite3 has no prebuilt binary and always compiles via
          # node-gyp. node-gyp's own Visual Studio auto-detection can fail
          # to recognize whatever VS version this runner image ships with,
          # so set up the MSVC build environment explicitly (this is what
          # "VCINSTALLDIR not set, not running in VS Command Prompt" means)
          # instead of relying on that detection.
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "vswhere could not find a Visual Studio install with the C++ (VC.Tools.x86.x64) workload." }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$vcvars`" x64 & set" | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                  [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
              }
          }
          Write-Host "VCINSTALLDIR = $env:VCINSTALLDIR"

          npm install --omit=dev --no-fund --no-audit

      - name: Download cloudflared (bundled into the installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile installer\runtime\cloudflared.exe

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsNetControl-Setup
          path: installer\dist\*.exe

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer-latest
          name: KidsNetControl Installer (latest build)
          body: |
            מתקין Windows (.exe) שנבנה אוטומטית מהקומיט ${{ github.sha }}.
            הורידו את הקובץ למטה, הריצו אותו על מחשב הילדים בתור Administrator,
            ועקבו אחרי האשף.
          prerelease: true
          files: installer/dist/*.exe
